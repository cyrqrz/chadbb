name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:db:portable
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results
      - uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: dist
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:start
      - run: npm run db:reset
      - run: npm run db:test
      - run: npm run test:api
      - run: npx playwright install --with-deps chromium
      - run: npm run test:auth:local
      - name: Convites com navegador e backend locais
        run: |
          node_modules/.bin/supabase functions serve guest > /tmp/chadbb-guest-runtime.log 2>&1 &
          npm run test:invites:local
      - if: always()
        run: npm run db:stop
