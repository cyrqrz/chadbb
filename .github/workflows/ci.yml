name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:db:portable
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results
      - uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: dist
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:start
      - run: npm run db:reset
      - run: npm run db:test
      - name: Start guest API
        run: |
          npm run guest:serve > /tmp/chadbb-guest.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -s -o /dev/null -f -X OPTIONS http://127.0.0.1:54321/functions/v1/guest; then break; fi
            sleep 1
          done
      - run: npm run test:api
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser:local
      - if: always()
        run: npm run db:stop
